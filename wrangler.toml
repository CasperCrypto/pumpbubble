# pumpbubble.fun — Cloudflare Worker config
#
# First-time setup (see docs/deploy.md for the full walkthrough):
#   npx wrangler login
#   npx wrangler kv namespace create BUBBLE_KV     # paste the id below
#   npx wrangler secret put IMG_SECRET             # any long random string
#   npx wrangler secret put TREASURY_WALLET        # your Solana receiving wallet
#   npx wrangler deploy

name = "pumpbubble"
main = "worker/index.js"
compatibility_date = "2026-08-01"

# Declaring routes (see the bottom of this file) turns the workers.dev URL off
# unless this says otherwise, which takes away the only reachable address while
# a new custom domain's certificate is still being issued. Keep it as a fallback
# for testing and for the next time DNS changes.
#
# This has to live up here, above every [table] header: in TOML a key written
# after `[[routes]]` becomes part of that route, and wrangler rejects the whole
# config rather than ignoring it.
workers_dev = true

# Keep values set in the dashboard instead of deleting them on deploy.
#
# This defaults to FALSE, which means a deploy wipes anything configured through
# the Cloudflare UI that is not also in this file. Since every push to main
# triggers a build, a secret added in the dashboard vanishes on the next commit —
# it looks like the dashboard is not saving, when really it saved and was then
# removed. That is what happened to SOLANA_RPC, repeatedly.
keep_vars = true

# Static files. Anything not matched by /api/* is served from here.
# Request logs in the Cloudflare dashboard (Workers & Pages → pumpbubble →
# Logs), sampled at one in ten: enough to see which route spends the free
# plan's 100,000 requests a day, well inside the free log allowance.
[observability]
enabled = true
head_sampling_rate = 0.1

[assets]
directory = "./public"
binding = "ASSETS"
# Workers Assets serves a matching file directly and never invokes the worker.
# /market matches market.html, so the server-rendering branch never ran and the
# raw shell went out with its placeholders intact. These paths must reach the
# worker first.
run_worker_first = ["/market", "/board", "/embed", "/swap"]

# Keeps a warm snapshot + persists market-cap history when traffic is quiet.
[triggers]
crons = ["*/5 * * * *"]

[vars]
# Public, non-secret config. Secrets go through `wrangler secret put`.
#
# The treasury address is public by nature — it is printed in the boost modal —
# so it lives here rather than in a secret. Changing it is a code change, which
# is what you want for the one value that decides where money goes.
TREASURY_WALLET = "6k8T4fXq5vt3asVnywaHgfw4ApRexGHupbUU8e3TsW1C"
AD_CONTACT = "https://t.me/casper_crypto"
# The operator's pump.fun invite link: shown to new traders on Solana token
# cards and in the bot's Start menu (src/refs.mjs pumpJoin). Public by nature.
PUMP_JOIN = "https://pump.fun/join/HermesCryptos"
# Our own Telegram group, linked from the bot's Start menu and setup reply.
TG_COMMUNITY = "https://t.me/pumpbubble"
# Our X account, linked from the bot's Start menu and setup reply.
X_PROFILE = "https://x.com/pumpbubblefun"
# The /swap page's fee (src/refs.mjs swapConfig). JUP_REFERRAL is the public key
# of a Jupiter referral account (referral.jup.ag, under the Jupiter Ultra
# project), which is where the fee lands; it goes in every swap it earns on, so
# it is config, not a secret. Uncomment with the real key once the account
# exists — until then swaps carry no fee. The account needs referral token
# accounts for the mints fees are taken in (SOL first, then USDC/USDT), or
# Jupiter executes the trade without the fee.
# JUP_REFERRAL = ""
# 1% (2026-10-01, the operator's call): Jupiter keeps a fifth, so 0.8% lands.
# Jupiter allows 50-255; swapConfig clamps to that.
JUP_FEE_BPS = "100"

# SOLANA_RPC is deliberately NOT here.
#
# Vars and secrets share one namespace on Workers, so a var declared here
# overwrites a secret of the same name on every single deploy. Left in place it
# would silently replace the Helius endpoint with the rate-limited public one,
# and payments would stop verifying for a reason nothing in the logs explains.
#
# Set it as a secret instead — dashboard (Settings → Variables and Secrets) or:
#   npx wrangler secret put SOLANA_RPC
# The code falls back to the public endpoint if it is missing, which is fine for
# looking at the map and not fine for taking money.

# Tap wars. One Durable Object holds the arena (see src/taps.mjs for why a
# counter cannot live in KV). SQLite-backed, which is the kind the free plan
# allows; the migration below creates it on the first deploy that carries it.
[[durable_objects.bindings]]
name = "ARENA"
class_name = "TapArena"

[[migrations]]
tag = "v1-taps"
new_sqlite_classes = ["TapArena"]

# The group guard: one Durable Object per Telegram group (join captcha and the
# welcome message — see src/guard.mjs). SQLite-backed, like the arena, and for
# the same reason: KV's free writes are already spent, and a raid is a hundred
# joins a minute.
[[durable_objects.bindings]]
name = "GUARD"
class_name = "GroupGuard"

[[migrations]]
tag = "v2-guard"
new_sqlite_classes = ["GroupGuard"]

# EVM buy alerts: one Durable Object per chain (Base, Ethereum, Robinhood
# Chain) polling the followed pools' Swap events every few seconds — see
# src/evmbuy.mjs. Set ALCHEMY_KEY as a secret to use Alchemy instead of the
# public RPCs (one key serves all three).
[[durable_objects.bindings]]
name = "EVM"
class_name = "EvmWatch"

[[migrations]]
tag = "v3-evm"
new_sqlite_classes = ["EvmWatch"]

# The bot's list and the mass DM (src/audience.mjs): everyone who pressed
# Start, and a send paced at Telegram's rate by this object's alarm.
[[durable_objects.bindings]]
name = "AUDIENCE"
class_name = "AudienceDO"

[[migrations]]
tag = "v4-audience"
new_sqlite_classes = ["AudienceDO"]

# Callers (src/callers.mjs): one watcher that reads pump.fun's callout feeds
# every 20 seconds and keeps the callers' records, so the map's Calls tab and
# the bot's call alerts never poll pump.fun per visitor.
[[durable_objects.bindings]]
name = "CALLERS"
class_name = "CallersDO"

[[migrations]]
tag = "v5-callers"
new_sqlite_classes = ["CallersDO"]

# Created by `wrangler kv namespace create BUBBLE_KV` — paste the id it prints.
[[kv_namespaces]]
binding = "BUBBLE_KV"
id = "769139d9eb6d428bbe95b7341bb0f09f"

# Custom domain. `custom_domain = true` makes the deploy create the DNS record
# and issue the certificate itself — there is nothing to add by hand, and the
# zone-level "Workers Routes" screen stays empty because a custom domain is not
# a route. Both point traffic at the worker; only this one manages DNS for you.
[[routes]]
pattern = "pumpbubble.fun"
custom_domain = true

# The share-card renderer needs its display font as bytes, not as a file the
# browser fetches: the card is rasterised inside the Worker, where there are no
# system fonts at all. Text would silently render as nothing without this.
[[rules]]
type = "Data"
globs = ["**/*.ttf"]
fallthrough = true
