<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Swap · pumpbubble.fun</title>
<meta name="description" content="Buy any Solana token in your own wallet, powered by Jupiter.">
<link rel="icon" href="/favicon.png">
<!--
  The swap lives on its own page because Jupiter's widget loads its code,
  wallet adapters and token art from many hosts. The map keeps its strict
  Content-Security-Policy (it renders attacker-chosen token names next to a
  payment address); this page relaxes it for Jupiter alone, and renders only
  a validated mint and our own API's escaped fields. _headers has the policy.

  Nothing here holds keys or money: the visitor connects their own wallet in
  Jupiter's widget and signs every swap themselves. When the operator has a
  Jupiter referral account set (JUP_REFERRAL), the widget adds pumpbubble's
  fee to the quote, and the page says so under the swap.
-->
<style>
:root{--bg:#06090c;--glass:rgba(255,255,255,.045);--line:rgba(255,255,255,.09);--ink:#eef3f7;--dim:#8b98a8;--mint:#28e08c}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1200px 600px at 20% -10%,#0d2a1b 0%,var(--bg) 55%) fixed;color:var(--ink);
  font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;padding:max(16px,env(safe-area-inset-top)) 16px 40px}
/* 360px is the widget's own width (Jupiter fixes it); the rest matches it */
.wrap{max-width:360px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:center;gap:10px}
header img{width:26px;height:26px}
header b{font-weight:900;letter-spacing:.01em}
header a{margin-left:auto;color:var(--dim);text-decoration:none;font-size:13px;font-weight:700}
header a:hover{color:var(--ink)}
.tok{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--glass)}
/* display:flex beats the hidden attribute; the map's card learned this too */
.tok[hidden]{display:none}
.tok .im{width:40px;height:40px;border-radius:50%;background:#1a2230;object-fit:cover;flex:0 0 auto;display:grid;place-items:center;font-weight:900}
.tok .n{min-width:0}
.tok .n b{display:block;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tok .n small{color:var(--dim);font-size:12.5px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tok .mc{margin-left:auto;text-align:right;font-variant-numeric:tabular-nums;font-weight:800}
.tok .mc small{display:block;color:var(--dim);font-weight:600;font-size:11px}
#jupiter{min-height:550px;border-radius:16px;overflow:hidden}
.note{color:var(--dim);font-size:12.5px;line-height:1.55}
.note a{color:var(--mint)}
.err{border:1px solid rgba(255,90,90,.35);background:rgba(255,90,90,.08);padding:12px 14px;border-radius:12px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="/mark.png" alt="" width="26" height="26">
    <b>pumpbubble</b><span style="color:var(--dim);font-weight:700">swap</span>
    <a href="/" id="back">← Back to the map</a>
  </header>
  <div class="tok" id="tok" hidden></div>
  <div id="jupiter"></div>
  <p class="note" id="note">Swaps run on <a href="https://jup.ag" target="_blank" rel="noopener">Jupiter</a>. You connect your own wallet and sign every trade yourself; pumpbubble never holds your funds.</p>
</div>

<script src="https://plugin.jup.ag/plugin-v1.js" data-preload defer></script>
<script>
(function () {
  var SOL = 'So11111111111111111111111111111111111111112';
  var q = new URLSearchParams(location.search);
  var mint = q.get('mint') || '';
  /* only a Solana address ever reaches the widget or the page */
  if (!/^[1-9A-HJ-NP-Za-km-z]{32,44}$/.test(mint)) mint = '';
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var usd = function (n) { n = +n || 0; return n >= 1e9 ? '$' + (n / 1e9).toFixed(2) + 'B' : n >= 1e6 ? '$' + (n / 1e6).toFixed(2) + 'M' : n >= 1e3 ? '$' + Math.round(n / 1e3) + 'K' : n > 0 ? '$' + n.toFixed(0) : '—'; };
  if (mint) document.getElementById('back').href = '/s/' + encodeURIComponent(mint);

  var cfg = fetch('/api/swap-config').then(function (r) { return r.json(); }).catch(function () { return {}; });
  if (mint) {
    fetch('/api/token?mint=' + encodeURIComponent(mint)).then(function (r) { return r.json(); }).then(function (j) {
      var t = j && j.ok && j.token; if (!t) return;
      var el = document.getElementById('tok');
      /* token art is our own signed proxy path, or nothing */
      var im = typeof t.img === 'string' && t.img.indexOf('/api/img?') === 0
        ? '<img class="im" src="' + esc(t.img) + '" alt="">'
        : '<span class="im">' + esc(String(t.sym || '?').charAt(0)) + '</span>';
      el.innerHTML = im + '<div class="n"><b>$' + esc(t.sym || '?') + '</b><small>' + esc(t.name || '') + '</small></div>'
        + '<div class="mc">' + usd(t.mcap) + '<small>market cap</small></div>';
      el.hidden = false;
    }).catch(function () {});
  }

  function start(c) {
    if (!window.Jupiter || !window.Jupiter.init) { return setTimeout(function () { start(c); }, 150); }
    var formProps = { initialInputMint: SOL, initialOutputMint: mint || undefined };
    if (c && c.referralAccount && c.feeBps) {
      formProps.referralAccount = c.referralAccount;
      formProps.referralFee = c.feeBps;
      document.getElementById('note').insertAdjacentHTML('beforeend',
        ' The quote includes a ' + (c.feeBps / 100).toFixed(2).replace(/0$/, '') + '% pumpbubble fee, which keeps the map free.');
    }
    window.Jupiter.init({
      displayMode: 'integrated',
      integratedTargetId: 'jupiter',
      formProps: formProps,
      branding: { name: 'pumpbubble', logoUri: location.origin + '/mark.png' },
      defaultExplorer: 'Solscan',
    });
  }
  var loadErr = setTimeout(function () {
    if (!window.Jupiter) document.getElementById('jupiter').innerHTML =
      '<div class="err">The swap did not load. Check your connection, or buy on <a href="https://jup.ag/swap/SOL-' + encodeURIComponent(mint) + '" target="_blank" rel="noopener">jup.ag</a> directly.</div>';
  }, 12000);
  cfg.then(function (c) { start(c); if (window.Jupiter) clearTimeout(loadErr); });
})();
</script>
</body>
</html>
