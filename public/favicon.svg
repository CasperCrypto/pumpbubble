<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Three overlapping bubbles: the product in one glyph, legible at 16px. -->
  <rect width="64" height="64" rx="14" fill="#05070a"/>
  <circle cx="24" cy="26" r="15" fill="#28e08c" fill-opacity=".92"/>
  <circle cx="43" cy="38" r="12" fill="#ff4d6a" fill-opacity=".92"/>
  <circle cx="40" cy="19" r="8" fill="#ffc93c" fill-opacity=".95"/>
  <!-- highlight, so they read as liquid rather than as flat dots -->
  <ellipse cx="19" cy="19" rx="5" ry="3.4" fill="#fff" fill-opacity=".38" transform="rotate(-25 19 19)"/>
</svg>
