<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Affiliate earnings — pumpbubble.fun</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg">
<style>
:root{--bg:#070910;--ink:#eef2f8;--dim:#8a93a6;--line:rgba(255,255,255,.10);
  --glass:rgba(255,255,255,.035);--glass2:rgba(255,255,255,.07);
  --mint:#28e08c;--mint2:#3df09b;--gold:#ffc93c;--rose:#ff4d6d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.6 ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--mint2)}
.wrap{max-width:820px;margin:0 auto;padding:0 20px 70px}
header{padding:36px 0 10px;display:flex;align-items:center;gap:12px}
.mark{width:24px;height:24px;border-radius:50%;
  background:radial-gradient(circle at 34% 30%,#7dffc4,#0fae66 60%,#046b3d);
  box-shadow:0 0 20px rgba(40,224,140,.45)}
.wordmark{font-weight:900;font-size:18px;letter-spacing:-.02em}
.wordmark i{font-style:normal;color:var(--dim)}
.back{margin-left:auto;font-size:13px;font-weight:700;color:var(--dim);text-decoration:none}
h1{font-size:26px;margin:16px 0 4px;font-weight:900;letter-spacing:-.02em}
.sub{color:var(--dim);margin:0 0 20px}
.lookup{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 26px}
input{flex:1;min-width:200px;background:var(--glass2);border:1px solid var(--line);color:var(--ink);
  border-radius:11px;padding:11px 13px;font:700 14px ui-monospace,Menlo,monospace;outline:none}
input:focus{border-color:rgba(61,240,155,.5)}
button{background:linear-gradient(180deg,#3df09b,#0fae66);color:#04210f;border:0;
  border-radius:11px;padding:11px 18px;font:900 13.5px ui-sans-serif,sans-serif;cursor:pointer}
.cards{display:grid;gap:12px;grid-template-columns:repeat(2,1fr)}
@media(min-width:640px){.cards{grid-template-columns:repeat(4,1fr)}}
.kpi{border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--glass)}
.kpi u{display:block;text-decoration:none;font-size:10px;letter-spacing:.09em;
  text-transform:uppercase;color:var(--dim);font-weight:800}
.kpi b{display:block;font-size:22px;font-weight:900;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi.owed{border-color:rgba(255,201,60,.45);
  background:linear-gradient(180deg,rgba(255,201,60,.10),rgba(255,201,60,.02))}
.kpi.owed b{color:var(--gold)}
.link{margin:22px 0 0;padding:14px;border:1px dashed rgba(255,255,255,.16);border-radius:14px;
  background:rgba(255,255,255,.02)}
.link code{display:block;margin-top:6px;color:#7fd7ff;font-size:13px;word-break:break-all;
  font-family:ui-monospace,Menlo,monospace;cursor:pointer}
table{width:100%;border-collapse:collapse;margin-top:22px;font-size:13.5px}
th{text-align:left;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);
  padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:10px;border-bottom:1px solid rgba(255,255,255,.05);font-variant-numeric:tabular-nums}
td.sym{font-weight:900}
.void{color:var(--rose);font-size:11px;font-weight:800}
.msg{padding:14px;border-radius:12px;background:var(--glass);border:1px solid var(--line);color:var(--dim)}
.msg.bad{border-color:rgba(255,77,109,.4);color:#ffb3c1}
footer{margin-top:44px;padding-top:18px;border-top:1px solid var(--line);color:var(--dim);font-size:13px}
</style>
</head>
<body>
<div class="wrap">

<header>
  <div class="mark"></div>
  <div class="wordmark">pumpbubble<i>.fun</i></div>
  <a class="back" href="/">← the map</a>
</header>

<h1>Affiliate earnings</h1>
<p class="sub">Every boost bought through your link, and what it earned you.
Each line links to the transaction on Solscan — check any of it against the
<a href="/api/boost/history" target="_blank" rel="noopener">public ledger</a>.</p>

<div class="lookup">
  <input id="code" placeholder="your code, e.g. alice" spellcheck="false" autocomplete="off">
  <button id="go">Look up</button>
</div>

<div id="out"></div>

<footer>
  Payouts are sent manually, usually weekly.
  Questions → <a href="https://t.me/casper_crypto" target="_blank" rel="noopener">Telegram</a>.
</footer>

</div>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'$'+(Number(n)||0).toFixed(2);
const when=t=>new Date(t).toISOString().slice(0,16).replace('T',' ');

async function load(code){
  const out=$('out');
  out.innerHTML='<div class="msg">checking…</div>';
  try{
    const r=await fetch('/api/affiliate?code='+encodeURIComponent(code));
    const s=await r.json();
    if(!s.ok){out.innerHTML='<div class="msg bad">'+esc(s.error||'not found')+'</div>';return}

    const link=location.origin+'/?ref='+s.code;
    out.innerHTML=`
      <div class="cards">
        <div class="kpi"><u>Referrals</u><b>${s.referrals}</b></div>
        <div class="kpi"><u>Earned</u><b>${money(s.earnedUsd)}</b></div>
        <div class="kpi"><u>Paid out</u><b>${money(s.paidUsd)}</b></div>
        <div class="kpi owed"><u>Owed</u><b>${money(s.owedUsd)}</b></div>
      </div>

      <div class="link">
        <b>Your link</b> — ${s.pct}% of every boost bought through it
        <code id="cp">${esc(link)}</code>
      </div>

      ${s.boosts.length?`<table>
        <thead><tr><th>When</th><th>Token</th><th>Tier</th><th>Sale</th><th>You earned</th><th></th></tr></thead>
        <tbody>${s.boosts.map(b=>`<tr>
          <td>${when(b.at)}</td>
          <td class="sym">${esc(b.sym)}</td>
          <td>${esc(b.tier)}</td>
          <td>${money(b.usd)}</td>
          <td>${b.voided?'<span class="void">'+esc(b.voided)+'</span>':money(b.commissionUsd)}</td>
          <td><a href="${esc(b.explorer)}" target="_blank" rel="noopener">tx ↗</a></td>
        </tr>`).join('')}</tbody></table>`
        :'<div class="msg" style="margin-top:20px">No referred sales yet. Share your link and they show up here as soon as a payment confirms.</div>'}
    `;

    const cp=$('cp');
    if(cp)cp.onclick=async()=>{
      try{await navigator.clipboard.writeText(link);cp.textContent='copied ✓';
        setTimeout(()=>cp.textContent=link,1200)}catch(e){}
    };
  }catch(e){
    out.innerHTML='<div class="msg bad">could not reach the server — try again in a moment</div>';
  }
}

$('go').onclick=()=>{const c=$('code').value.trim().toLowerCase();if(c){history.replaceState(null,'','?code='+encodeURIComponent(c));load(c)}};
$('code').addEventListener('keydown',e=>{if(e.key==='Enter')$('go').click()});

/* deep link straight to a statement, so the link we send an affiliate just works */
const initial=new URLSearchParams(location.search).get('code');
if(initial){$('code').value=initial;load(initial.toLowerCase())}
</script>
</body>
</html>
