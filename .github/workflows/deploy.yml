name: Deploy

# Manual trigger only, deliberately.
#
# GitHub Actions bills against a minutes quota on private repos, and this
# account's billing is currently blocked — a push trigger would fail before the
# job even starts and mail a failure notice every time. Cloudflare's own Git
# integration (Workers Builds) is the route in use instead; see docs/deploy.md.
#
# To go back to deploying on every push, once GitHub billing is sorted or the
# repo is public, add:
#   push:
#     branches: [main]
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The payment tests run offline (they stand a fake RPC in front of the
      # real matching code), so they are safe to gate a deploy on. If someone
      # breaks underpayment handling, this fails and nothing ships.
      - name: Payment abuse tests
        run: node scripts/payment-abuse.test.mjs

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
